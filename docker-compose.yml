services:
  app:
    build: .
    container_name: family-finance-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://family_user:family_password@db:5432/family_db?schema=public
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    restart: always

  db:
    image: postgres:15-alpine
    container_name: family-finance-db
    environment:
      - POSTGRES_USER=family_user
      - POSTGRES_PASSWORD=family_password
      - POSTGRES_DB=family_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_user -d family_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
